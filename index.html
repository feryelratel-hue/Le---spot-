<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Le Spot | Coffee & Food</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f8f4ef;
      color: #2d211b;
      line-height: 1.6;
    }

    header {
      background: #2d211b;
      color: white;
      padding: 20px 8%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .logo {
      font-size: 28px;
      font-weight: bold;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-left: 25px;
      font-weight: bold;
    }

    nav a:hover {
      opacity: 0.7;
    }

    .hero {
      min-height: 80vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 60px 20px;
      background: linear-gradient(
        rgba(45, 33, 27, 0.75),
        rgba(45, 33, 27, 0.75)
      ),
      url("https://images.unsplash.com/photo-1501339847302-ac426a4a7cbb?auto=format&fit=crop&w=1600&q=80")
      center/cover;
      color: white;
    }

    .hero-content {
      max-width: 750px;
    }

    .hero h1 {
      font-size: 64px;
      margin-bottom: 15px;
    }

    .hero p {
      font-size: 22px;
      margin-bottom: 30px;
    }

    .btn {
      display: inline-block;
      background: #c58b5b;
      color: white;
      padding: 14px 28px;
      border-radius: 30px;
      text-decoration: none;
      margin: 5px;
      font-weight: bold;
    }

    .btn:hover {
      opacity: 0.85;
    }

    section {
      padding: 70px 8%;
      text-align: center;
    }

    section h2 {
      font-size: 36px;
      margin-bottom: 15px;
    }

    .intro {
      max-width: 750px;
      margin: auto;
    }

    .menu {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 25px;
      margin-top: 40px;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 18px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    .card h3 {
      margin-bottom: 10px;
      font-size: 22px;
    }
